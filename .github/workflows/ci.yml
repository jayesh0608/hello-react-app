name: React CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - run: npm ci

      - name: Build React App
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider